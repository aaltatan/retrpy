[project]
name = "retrpy"
version = "0.1.0"
description = "Retry and fallback as plans of attempts, composed with * and +."
readme = "README.md"
authors = [
    { name = "aaltatan", email = "a.altatan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.mypy]
strict = true
