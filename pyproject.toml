[project]
name = "retrpy"
version = "0.1.0"
description = "Retry and fallback as plans of attempts, composed with * and +."
readme = "README.md"
authors = [
    { name = "aaltatan", email = "a.altatan@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["retry", "fallback", "backoff", "resilience", "jitter", "functional"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aaltatan/retrpy"
Repository = "https://github.com/aaltatan/retrpy"
Issues = "https://github.com/aaltatan/retrpy/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]
docs = [
    "mkdocs-material>=9.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.mypy]
strict = true
